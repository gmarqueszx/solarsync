# Pilha do SolarSync num servidor só: Postgres, API, e o Caddy que termina o TLS, serve a
# interface e faz proxy da API — tudo num domínio só.
#
# Rode daqui de dentro:  cd deploy && docker compose up -d --build
# Os segredos vêm de ./.env, que não está no Git — copie o .env.example ao lado.
# O build precisa do clone do frontend ao lado deste repositório (ver o serviço `caddy`).
#
# ⚠️ Só o Caddy publica porta. O Postgres e a API existem apenas na rede interna do compose:
# expor 5432 num VPS com IP público é como o banco de um sistema interno costuma vazar, e a API
# sem TLS na frente serviria o login em texto claro.

name: solarsync-${SOLARSYNC_AMBIENTE:-homologacao}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solarsync}
      POSTGRES_USER: ${POSTGRES_USER:-solarsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Explícito porque é o que garante que a senha acima não vire decoração: o valor `trust`
      # aqui faria o Postgres aceitar qualquer conexão da rede do compose sem autenticar.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      # É o que segura a API até o banco aceitar conexão. Sem isso o Flyway tenta migrar contra
      # um Postgres que ainda está inicializando e o primeiro `up` falha na cara de quem deploya.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solarsync} -d ${POSTGRES_DB:-solarsync}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: solarsync-api:${SOLARSYNC_VERSAO:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Todo SOLARSYNC_* e SPRING_* do .env entra no container. É proposital: variável nova da
    # aplicação (uma integração, por exemplo) passa a valer sem mexer neste arquivo.
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Sobrepõe o que estiver no .env: o banco é o serviço ao lado, na rede interna.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-solarsync}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-solarsync}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Há um proxy de verdade na frente (o Caddy), então X-Forwarded-For é confiável e o limite
      # por origem volta a distinguir quem chamou. Com `false` aqui, toda requisição pareceria
      # vir do IP do container do Caddy e o limite de 60/15min viraria global — o escritório
      # inteiro trancado por um atacante. Ver seção 8, item 11 do CLAUDE.md.
      SOLARSYNC_LOGIN_CONFIAR_EM_PROXY: "true"
    # ⚠️ Sem teto, o `-XX:MaxRAMPercentage=75` do Dockerfile é 75% da RAM do servidor inteiro, e
    # a JVM passa a achar que pode usar a memória do Postgres também — o sintoma é o Postgres
    # morrer por OOM sob carga, longe da causa. Com o teto, são ~1,1 GB de heap, que sobra para
    # este sistema e deixa o resto do VPS respirar.
    mem_limit: ${SOLARSYNC_API_MEMORIA:-1536m}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # A aplicação sobe o contexto do Spring e roda o Flyway antes de responder; marcar como
      # unhealthy nesse meio-tempo derrubaria o container em loop.
      start_period: 90s

  # Serve a interface e faz proxy de /api/* para a API — no mesmo domínio, que é o que elimina o
  # CORS. A imagem sai do repositório do frontend: ela é um Caddy com o `dist` dentro. A
  # configuração, essa continua aqui, montada de deploy/Caddyfile.
  #
  # ⚠️ O contexto aponta para um clone IRMÃO do solarsync-web, ao lado deste repositório:
  #   /opt/solarsync/solarsync/        (este)
  #   /opt/solarsync/solarsync-front/  (o do frontend)
  # Sem ele, `docker compose build` falha dizendo que o caminho não existe. Ver deploy/README.md.
  caddy:
    build:
      context: ${SOLARSYNC_FRONT_CAMINHO:-../../solarsync-front}
      dockerfile: Dockerfile
    image: solarsync-web:${SOLARSYNC_VERSAO:-local}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      SOLARSYNC_DOMINIO: ${SOLARSYNC_DOMINIO:?defina SOLARSYNC_DOMINIO no .env}
      SOLARSYNC_ACME_EMAIL: ${SOLARSYNC_ACME_EMAIL:?defina SOLARSYNC_ACME_EMAIL no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Blocos de site dos outros sistemas do VPS, importados no fim do Caddyfile.
      - /opt/caddy-sites:/etc/caddy/sites:ro
      # Guarda os certificados emitidos. Sem este volume, cada `up` pediria certificado novo ao
      # Let's Encrypt e o limite de emissão (5 por semana por domínio) seria atingido rápido.
      - caddy-dados:/data
      - caddy-config:/config
    networks:
      - default
      # Rede compartilhada com os outros sistemas do VPS, para os quais este Caddy faz proxy.
      # Só o Caddy entra nela: a API e o Postgres do SolarSync continuam isolados.
      - edge

volumes:
  postgres-dados:
  caddy-dados:
  caddy-config:

networks:
  # Criada pelo deploy.sh se ainda não existir; externa para não pertencer a nenhuma das pilhas.
  edge:
    external: true
