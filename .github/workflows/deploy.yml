# Publica no VPS a cada push na main — mas só depois de a suíte passar.
#
# A suíte não roda dentro da imagem (exige Docker, e seria Docker dentro de Docker; ver seção 14
# do CLAUDE.md). O runner do GitHub tem Docker, então é aqui que o Testcontainers roda, e é isto
# que transforma o "rode ./mvnw test antes de publicar" do deploy.sh de pedido em regra.
#
# O deploy em si continua sendo o deploy/deploy.sh no servidor: este workflow só entra por SSH e
# o dispara. A chave é restrita no authorized_keys a esse único comando (deploy/README.md), então
# um vazamento do secret permite no máximo republicar a main.
#
# O solarsync-web tem o workflow irmão, que dispara o mesmo script: o deploy.sh atualiza os dois
# repositórios, então tanto faz qual deles mudou.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dois pushes seguidos não podem publicar em paralelo nem se cancelar no meio de um build.
# O deploy.sh também trava com flock, porque o workflow do frontend não enxerga este grupo.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # O mvnw está no git sem o bit de execução.
      - name: Suíte (Testcontainers com Postgres real)
        run: bash ./mvnw -B test

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    steps:
      - name: Disparar deploy/deploy.sh no servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USUARIO: ${{ secrets.DEPLOY_USUARIO }}
          DEPLOY_CHAVE_SSH: ${{ secrets.DEPLOY_CHAVE_SSH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # Secret ausente chega como string vazia, e o ssh só responde com o "usage" — que não diz
          # nada. Foi assim na primeira execução: os secrets estavam em outro environment.
          for v in DEPLOY_HOST DEPLOY_USUARIO DEPLOY_CHAVE_SSH DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v vazio. Ele precisa estar no environment 'prod' deste repositório."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          # Copiar a chave do terminal web do painel traz espaço no fim das linhas e \r do Windows,
          # e o ssh responde só "error in libcrypto". Limpar aqui é o que torna o copiar-e-colar
          # confiável; se ainda assim não for uma chave, mostrar o FORMATO dela (quantidade e
          # tamanho das linhas, cabeçalho e rodapé) — nada disso revela a chave.
          limpar() { tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d'; }
          printf '%s\n' "$DEPLOY_CHAVE_SSH" | limpar > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          if ! ssh-keygen -y -f ~/.ssh/deploy > /dev/null 2>&1; then
            echo "::error::DEPLOY_CHAVE_SSH não é uma chave privada válida."
            echo "Linhas: $(wc -l < ~/.ssh/deploy); tamanho de cada: $(awk '{printf "%d ", length}' ~/.ssh/deploy)"
            echo "Primeira: $(head -1 ~/.ssh/deploy)"
            echo "Última:   $(tail -1 ~/.ssh/deploy)"
            exit 1
          fi
          # known_hosts fixo, e não StrictHostKeyChecking=no: sem ele, quem se passasse pelo
          # servidor receberia a conexão sem aviso nenhum.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | limpar > ~/.ssh/known_hosts
          # Sem comando: quem decide o que roda é o command= do authorized_keys.
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$DEPLOY_USUARIO@$DEPLOY_HOST"
