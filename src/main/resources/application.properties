spring.application.name=solarsync

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Reduz N+1 nas listagens paginadas sem precisar de fetch join em cada consulta.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Datas saem em ISO-8601 sem precisar de configuração: no Jackson 3 (Boot 4) o
# WRITE_DATES_AS_TIMESTAMPS saiu de SerializationFeature para DateTimeFeature e passou a vir
# desabilitado por padrão. Configurar a chave antiga aqui derruba a aplicação no boot.

# Sem segredo no repositório (checklist item 6 do CLAUDE.md). Ausente em dev, um segredo
# aleatório é gerado no boot — os tokens então não sobrevivem a restart, o que é aceitável
# localmente e inaceitável em produção, onde SOLARSYNC_JWT_SEGREDO é obrigatório.
solarsync.jwt.segredo=${SOLARSYNC_JWT_SEGREDO:}
solarsync.jwt.emissor=solarsync
solarsync.jwt.access-token-duracao=PT15M
solarsync.jwt.refresh-token-duracao=PT8H

# Origem do solarsync-web em desenvolvimento.
solarsync.cors.origens=${SOLARSYNC_CORS_ORIGENS:http://localhost:5173}

# Saída estável do /v3/api-docs, para o docs/api/openapi.json commitado não gerar diff de ruído.
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true

# --- Integrações de entrada (seção 9) ---
# Desligadas por padrão, e é o padrão que importa: os jobs são beans condicionais, então sem
# estas variáveis não existe nada agendado e nenhuma chamada externa acontece — nem nos testes,
# nem no desenvolvimento local de quem não está mexendo nisso.
#
# Nenhum segredo no repositório (item 6 do checklist): token do Nectar e credenciais do Google
# vêm do ambiente. Ver .env.example.
solarsync.nectar.ativo=${SOLARSYNC_NECTAR_ATIVO:false}
solarsync.nectar.token=${SOLARSYNC_NECTAR_TOKEN:}
solarsync.nectar.intervalo=PT10M

solarsync.gmail.ativo=${SOLARSYNC_GMAIL_ATIVO:false}
solarsync.gmail.client-id=${SOLARSYNC_GMAIL_CLIENT_ID:}
solarsync.gmail.client-secret=${SOLARSYNC_GMAIL_CLIENT_SECRET:}
solarsync.gmail.refresh-token=${SOLARSYNC_GMAIL_REFRESH_TOKEN:}
solarsync.gmail.intervalo=PT15M
# Ensaio antes da estreia: lê de verdade, registra o que faria e não muda status nenhum.
solarsync.gmail.somente-conferencia=${SOLARSYNC_GMAIL_SOMENTE_CONFERENCIA:false}
# Em produção, true: busca só os e-mails dos projetos que ainda esperam retorno da Coelba.
solarsync.gmail.somente-projetos-conhecidos=${SOLARSYNC_GMAIL_SOMENTE_PROJETOS_CONHECIDOS:false}
