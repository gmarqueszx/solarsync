spring.application.name=solarsync

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Reduz N+1 nas listagens paginadas sem precisar de fetch join em cada consulta.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Datas saem em ISO-8601 sem precisar de configuração: no Jackson 3 (Boot 4) o
# WRITE_DATES_AS_TIMESTAMPS saiu de SerializationFeature para DateTimeFeature e passou a vir
# desabilitado por padrão. Configurar a chave antiga aqui derruba a aplicação no boot.

# Sem segredo no repositório (checklist item 6 do CLAUDE.md). Ausente em dev, um segredo
# aleatório é gerado no boot — os tokens então não sobrevivem a restart, o que é aceitável
# localmente e inaceitável em produção, onde SOLARSYNC_JWT_SEGREDO é obrigatório.
solarsync.jwt.segredo=${SOLARSYNC_JWT_SEGREDO:}
solarsync.jwt.emissor=solarsync
solarsync.jwt.access-token-duracao=PT15M
solarsync.jwt.refresh-token-duracao=PT8H

# Login com Google fica desabilitado enquanto o client ID não for configurado.
solarsync.google.client-id=${SOLARSYNC_GOOGLE_CLIENT_ID:}
solarsync.google.dominios-permitidos=conectsol.com

# Origem do solarsync-web em desenvolvimento.
solarsync.cors.origens=${SOLARSYNC_CORS_ORIGENS:http://localhost:5173}

# Saída estável do /v3/api-docs, para o docs/api/openapi.json commitado não gerar diff de ruído.
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
