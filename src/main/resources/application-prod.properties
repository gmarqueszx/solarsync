# Perfil de produção (VPS Contabo). Ativar com SPRING_PROFILES_ACTIVE=prod.

# Documentação interativa desligada: mais simples que autenticar o Swagger, e não deixa rota
# aberta descrevendo a API para quem não deveria vê-la.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# O compose.yaml é ferramenta de desenvolvimento; em produção o banco vem de variável.
spring.docker.compose.enabled=false

# Não vazar detalhe interno em resposta de erro.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# HTTPS termina no proxy reverso (Cloudflare/nginx): sem isto a aplicação monta URLs http.
server.forward-headers-strategy=native
